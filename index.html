<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shebl | Streamer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #d4a373;
    --gold-light: #f5e6c8;
    --dark: #0a0c0f;
    --dark2: #111318;
    --cord-y: 155px;
  }

  html, body {
    width: 100%; min-height: 100vh;
    background: var(--dark);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    overflow-x: hidden;
    transition: background 0.7s ease;
  }

  /* ── BG IMAGE ── */
  #bg-img {
    position: fixed; inset: 0;
    background: url('https://files.catbox.moe/og2hd9.png') center/cover no-repeat;
    opacity: 0;
    transition: opacity 1s ease;
    z-index: 0;
    pointer-events: none;
  }
  #bg-img::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.7) 100%);
  }

  /* ── WARM GLOW ── */
  #bg-glow {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 70% 55% at 40% 35%, rgba(255,195,70,0.18), transparent 70%);
    opacity: 0;
    transition: opacity 0.7s ease;
    z-index: 0;
    pointer-events: none;
  }

  /* ── LAYOUT ── */
  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 60px;
    padding: 40px 24px;
    flex-wrap: wrap;
  }

  /* ══════════════════════════════
     LAMP
  ══════════════════════════════ */
  .lamp-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .lamp-wrap {
    position: relative;
    width: 200px;
    height: 340px;
  }

  .lamp-svg { width: 100%; height: 100%; overflow: visible; display: block; }

  /* shade */
  .l-shade {
    fill: #ddd8ce;
    transition: fill 0.6s ease, filter 0.6s ease;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
  }
  body.on .l-shade {
    fill: #fffef5;
    filter: drop-shadow(0 0 28px rgba(255,240,120,0.65)) drop-shadow(0 2px 6px rgba(0,0,0,0.2));
  }

  /* inner warm bulb */
  .l-bulb {
    fill: #ffd766;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  body.on .l-bulb { opacity: 0.7; }

  /* stem & base */
  .l-stem { fill: #c2bdb4; }
  .l-base { fill: #b8b3aa; }
  .l-foot { fill: #aaa59c; }

  /* cord */
  .l-cord { stroke: #444; stroke-width: 2.5; stroke-linecap: round; }
  .l-bead {
    fill: #c8874a;
    cursor: grab;
    transition: fill 0.2s;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.5));
  }
  .l-bead:active { cursor: grabbing; fill: #e09a5a; }
  .l-hit { cursor: grab; fill: transparent; }

  /* shade inner highlight arc */
  .l-highlight {
    fill: none;
    stroke: rgba(255,255,255,0.12);
    stroke-width: 2;
    opacity: 0;
    transition: opacity 0.6s;
  }
  body.on .l-highlight { opacity: 1; }

  .pull-hint {
    color: #444;
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
    transition: color 0.5s, opacity 0.5s;
    opacity: 0.8;
    user-select: none;
  }
  body.on .pull-hint { color: #888; }

  /* ══════════════════════════════
     PROFILE CARD
  ══════════════════════════════ */
  .profile-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    transform: translateY(30px) scale(0.96);
    pointer-events: none;
    transition:
      opacity 0.75s cubic-bezier(0.175, 0.885, 0.32, 1.275),
      transform 0.75s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  body.on .profile-col {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: all;
  }

  /* avatar */
  .avatar-ring {
    position: relative;
    width: 120px; height: 120px;
    margin-bottom: 18px;
  }
  .avatar-ring::before {
    content: '';
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    background: conic-gradient(#d4a373, #f5e6c8, #b38728, #f5e6c8, #d4a373);
    animation: spin 4s linear infinite;
    opacity: 0;
    transition: opacity 0.6s;
  }
  body.on .avatar-ring::before { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .avatar-ring::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: var(--dark);
    transition: background 0.7s;
  }
  body.on .avatar-ring::after { background: #12151a; }

  .avatar-img {
    position: relative;
    z-index: 1;
    width: 120px; height: 120px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }

  /* glow pulse behind avatar */
  .avatar-glow {
    position: absolute;
    inset: -18px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212,163,115,0.35), transparent 65%);
    animation: pulse 2.6s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
    opacity: 0;
    transition: opacity 0.6s;
  }
  body.on .avatar-glow { opacity: 1; }
  @keyframes pulse {
    0%,100% { transform: scale(1); opacity: 0.7; }
    50% { transform: scale(1.1); opacity: 1; }
  }

  /* name & tag */
  .p-name {
    color: #fff;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-shadow: 0 2px 16px rgba(0,0,0,0.7);
    margin-bottom: 4px;
    text-align: center;
  }
  .p-tag {
    color: var(--gold);
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 28px;
    text-align: center;
    text-shadow: 0 0 12px rgba(212,163,115,0.4);
  }

  /* ── LINKS ── */
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 270px;
  }

  .lbtn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 18px;
    border-radius: 16px;
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(14px);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .lbtn::before {
    content: '';
    position: absolute; inset: 0;
    background: rgba(255,255,255,0.035);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .lbtn:hover { transform: translateX(6px) scale(1.015); }
  .lbtn:hover::before { opacity: 1; }
  .lbtn:active { transform: translateX(6px) scale(0.98); }

  /* ripple */
  .lbtn .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    transform: scale(0);
    animation: ripple-anim 0.55s ease-out forwards;
    pointer-events: none;
  }
  @keyframes ripple-anim {
    to { transform: scale(3.5); opacity: 0; }
  }

  .lbtn-icon {
    width: 38px; height: 38px;
    border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 1rem;
  }

  .lbtn-text { flex: 1; }
  .lbtn-label { display: block; color: #fff; font-size: 0.9rem; font-weight: 600; }
  .lbtn-sub { display: block; color: rgba(255,255,255,0.42); font-size: 0.72rem; margin-top: 1px; }
  .lbtn-arr { color: rgba(255,255,255,0.25); font-size: 1rem; transition: color 0.2s, transform 0.2s; }
  .lbtn:hover .lbtn-arr { color: rgba(255,255,255,0.6); transform: translateX(3px); }

  /* colors per platform */
  .lbtn-discord { background: rgba(88,101,242,0.18); border-color: rgba(88,101,242,0.35); }
  .lbtn-discord:hover { box-shadow: 0 6px 28px rgba(88,101,242,0.38); border-color: rgba(88,101,242,0.7); }
  .lbtn-discord .lbtn-icon { background: #5865F2; }

  .lbtn-wa { background: rgba(37,211,102,0.14); border-color: rgba(37,211,102,0.3); }
  .lbtn-wa:hover { box-shadow: 0 6px 28px rgba(37,211,102,0.3); border-color: rgba(37,211,102,0.65); }
  .lbtn-wa .lbtn-icon { background: #25D366; }

  .lbtn-tt { background: rgba(20,20,20,0.55); border-color: rgba(255,255,255,0.12); }
  .lbtn-tt:hover { box-shadow: 0 6px 28px rgba(255,0,80,0.25); border-color: rgba(255,0,80,0.5); }
  .lbtn-tt .lbtn-icon { background: #010101; border: 1px solid #333; }

  .lbtn-kick { background: rgba(83,252,27,0.1); border-color: rgba(83,252,27,0.25); }
  .lbtn-kick:hover { box-shadow: 0 6px 28px rgba(83,252,27,0.22); border-color: rgba(83,252,27,0.6); }
  .lbtn-kick .lbtn-icon { background: #53FC1B; }

  /* ── PARTICLES ── */
  #particles {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,210,80,0.55);
    animation: float-up linear infinite;
    opacity: 0;
  }
  @keyframes float-up {
    0% { transform: translateY(0) scale(1); opacity: 0; }
    10% { opacity: 0.7; }
    90% { opacity: 0.3; }
    100% { transform: translateY(-110vh) scale(0.3); opacity: 0; }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 620px) {
    .page { gap: 30px; padding: 30px 16px; }
    .lamp-wrap { width: 160px; height: 270px; }
    .links { width: 240px; }
  }
</style>
</head>
<body>

<div id="bg-img"></div>
<div id="bg-glow"></div>
<div id="particles"></div>

<main class="page">

  <!-- LAMP COLUMN -->
  <div class="lamp-col">
    <div class="lamp-wrap">
      <svg class="lamp-svg" viewBox="0 0 170 280" xmlns="http://www.w3.org/2000/svg">
        <!-- inner warm glow blob -->
        <ellipse class="l-bulb" cx="85" cy="100" rx="50" ry="24"/>

        <!-- shade highlight arc -->
        <path class="l-highlight" d="M48 78 Q 85 58, 122 78"/>

        <path class="l-shade" d="M22 98 C 22 42, 148 42, 148 98 C 148 116, 22 116, 22 98 Z"/>

        <!-- stem -->
        <rect class="l-stem" x="78" y="110" width="14" height="142" rx="7"/>

        <!-- base disc -->
        <ellipse class="l-base" cx="85" cy="246" rx="30" ry="8"/>
        <!-- foot plate -->
        <rect class="l-foot" x="52" y="248" width="66" height="10" rx="5"/>

        <!-- pull cord -->
        <line class="l-cord" id="cordLine" x1="118" y1="112" x2="118" y2="172"/>
        <circle class="l-bead" id="beadCircle" cx="118" cy="180" r="9"/>
        <!-- invisible larger hit zone -->
        <circle class="l-hit" id="beadHit" cx="118" cy="180" r="28"/>
      </svg>
    </div>
    <p class="pull-hint" id="pullHint">↑ اسحب الخيط</p>
  </div>

  <!-- PROFILE COLUMN -->
  <div class="profile-col" id="profileCol">
    <div class="avatar-ring">
      <div class="avatar-glow"></div>
      <img class="avatar-img"
        src="https://files.catbox.moe/9onzuy.png"
        alt="Shebl"
        onerror="this.src='https://ui-avatars.com/api/?name=SH&background=d4a373&color=0a0c0f&size=120'"/>
    </div>

    <h1 class="p-name">Shebl</h1>
    <p class="p-tag">Streamer &nbsp;·&nbsp; Content Creator</p>

    <div class="links">

      <a class="lbtn lbtn-discord" href="https://discord.gg/UQtSzXS2" target="_blank" rel="noopener">
        <div class="lbtn-icon">
          <svg width="20" height="16" viewBox="0 0 24 18" fill="white">
            <path d="M20.3 1.5A19.8 19.8 0 0 0 15.4 0c-.2.4-.5 1-.6 1.4a18.4 18.4 0 0 0-5.6 0C9.1 1 8.7.4 8.5 0A19.9 19.9 0 0 0 3.6 1.5C.5 6.2-.3 10.8.1 15.4a20 20 0 0 0 6.1 3.1c.5-.7.9-1.4 1.3-2.2a13 13 0 0 1-2-1l.5-.4a14.3 14.3 0 0 0 12 0l.5.4a13 13 0 0 1-2 1c.4.8.8 1.5 1.3 2.2a19.9 19.9 0 0 0 6-3.1c.5-5.2-.9-9.7-3.7-13.9ZM8 12.6c-1.2 0-2.2-1.1-2.2-2.5S6.8 7.6 8 7.6s2.2 1.1 2.2 2.5-1 2.5-2.2 2.5Zm8 0c-1.2 0-2.2-1.1-2.2-2.5s1-2.5 2.2-2.5 2.2 1.1 2.2 2.5-1 2.5-2.2 2.5Z"/>
          </svg>
        </div>
        <div class="lbtn-text">
          <span class="lbtn-label">Discord</span>
          <span class="lbtn-sub">انضم للسيرفر</span>
        </div>
        <span class="lbtn-arr">›</span>
      </a>

      <a class="lbtn lbtn-wa" href="https://whatsapp.com/channel/0029Vb7sALoJ3juxfiTS7D05" target="_blank" rel="noopener">
        <div class="lbtn-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
            <path d="M17.5 14.4c-.3-.1-1.7-.8-1.9-.9-.3-.1-.5-.1-.7.1l-.9 1.1c-.1.2-.3.2-.6.1-1.6-.7-2.7-1.7-3.6-3.2-.3-.5 0-.7.2-.9l.6-.7c.2-.2.2-.4.1-.6l-.8-2c-.2-.5-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4C8 8.6 7 9.6 7 11.5c0 2 1.5 4 1.7 4.2.2.3 2.9 4.5 7 6.2.9.4 1.7.6 2.3.7 1 .2 1.8.2 2.5.1.8-.1 2.4-1 2.7-1.9.3-.9.3-1.7.2-1.9-.2-.1-.4-.2-.7-.3Z"/>
            <path d="M12 0C5.4 0 0 5.4 0 12c0 2.1.5 4.1 1.5 5.9L0 24l6.3-1.6C8 23.4 10 24 12 24c6.6 0 12-5.4 12-12S18.6 0 12 0Zm0 22c-1.9 0-3.7-.5-5.3-1.4l-.4-.2-3.7 1 1-3.6-.2-.4A10 10 0 0 1 2 12C2 6.5 6.5 2 12 2s10 4.5 10 10-4.5 10-10 10Z"/>
          </svg>
        </div>
        <div class="lbtn-text">
          <span class="lbtn-label">WhatsApp Channel</span>
          <span class="lbtn-sub">تابع القناة</span>

        <span class="lbtn-arr">›</span>
      </a>

      <a class="lbtn lbtn-tt" href="https://www.tiktok.com/@shebl318" target="_blank" rel="noopener">
        <div class="lbtn-icon">
          <svg width="17" height="19" viewBox="0 0 24 27" fill="white">
            <path d="M19.6 5.4A5.6 5.6 0 0 1 16 4V0h-4v18.5a3 3 0 1 1-2.5-3v-4a7 7 0 1 0 6.5 7V9.7a9.4 9.4 0 0 0 5.5 1.8V7.5a5.6 5.6 0 0 1-1.9-.1Z"/>
          </svg>
        </div>
        <div class="lbtn-text">
          <span class="lbtn-label">TikTok</span>
          <span class="lbtn-sub">@shebl318</span>

        <span class="lbtn-arr">›</span>

      <a class="lbtn lbtn-kick" href="https://kick.com/shebl911" target="_blank" rel="noopener">
        <div class="lbtn-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#0a0a0a">
            <path d="M4 2h4v8l6-8h5L12 11l7 11h-5l-6-8v8H4z"/>
          </svg>
        </div>
        <div class="lbtn-text">
          <span class="lbtn-label">Kick</span>

      </a>

    </div>
  </div>

</main>

<audio id="snd" src="https://files.catbox.moe/d5p37y.mp3" preload="auto"></audio>

<script>
  const body      = document.body;
  const cordLine  = document.getElementById('cordLine');
  const bead      = document.getElementById('beadCircle');
  const hit       = document.getElementById('beadHit');
  const profile   = document.getElementById('profileCol');
  const bgImg     = document.getElementById('bg-img');
  const bgGlow    = document.getElementById('bg-glow');
  const hint      = document.getElementById('pullHint');
  const snd       = document.getElementById('snd');
  const particles = document.getElementById('particles');

  const BEAD_BASE  = 180;
  const CORD_BASE  = 172;
  const MAX_PULL   = 65;
  const TRIGGER    = 32;

  let isOn    = false;
  let drag    = false;
  let startY  = 0;
  let pull    = 0;

  /* ── PARTICLE SYSTEM ── */
  let particleActive = false;

  function spawnParticle() {
    if (!particleActive) return;
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 3 + Math.random() * 5;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      left:${10 + Math.random()*80}%;
      bottom: -10px;
      animation-duration:${4 + Math.random()*5}s;
      animation-delay:${Math.random()*1.5}s;
    `;
    particles.appendChild(p);
    setTimeout(() => p.remove(), 9500);
  }

  let particleInterval = null;

  /* ── TOGGLE ── */
  function toggleLamp() {
    isOn = !isOn;
    snd.currentTime = 0;
    snd.play().catch(() => {});

    if (isOn) {
      body.classList.add('on');
      bgImg.style.opacity = '1';
      bgGlow.style.opacity = '1';
      body.style.background = '#0f1216';
      hint.textContent = '↑ اسحب للإطفاء';
      particleActive = true;
      particleInterval = setInterval(spawnParticle, 420);
    } else {
      body.classList.remove('on');
      bgImg.style.opacity = '0';
      bgGlow.style.opacity = '0';
      body.style.background = '#0a0c0f';
      hint.textContent = '↑ اسحب الخيط';
      particleActive = false;
      clearInterval(particleInterval);
      particles.innerHTML = '';
    }
  }

  /* ── DRAG ── */
  function setPull(dy) {
    pull = Math.max(0, Math.min(dy, MAX_PULL));
    bead.setAttribute('cy', BEAD_BASE + pull);
    hit.setAttribute('cy',  BEAD_BASE + pull);
    cordLine.setAttribute('y2', CORD_BASE + pull);
  }

  function spring() {
    let v = pull;
    const step = () => {
      v *= 0.65;
      if (v < 0.4) { setPull(0); return; }
      setPull(v);
      requestAnimationFrame(step);
    };
    step();
  }

  /* ripple on buttons */
  document.querySelectorAll('.lbtn').forEach(btn => {
    btn.addEventListener('click', function(e) {
      const r = document.createElement('div');
      r.className = 'ripple';
      const rect = this.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
      this.appendChild(r);
      setTimeout(() => r.remove(), 600);
    });
  });

  /* mouse */
  hit.addEventListener('mousedown', e => { drag = true; startY = e.clientY; e.preventDefault(); });
  window.addEventListener('mousemove', e => { if (drag) setPull(e.clientY - startY); });
  window.addEventListener('mouseup', () => {
    if (!drag) return; drag = false;
    if (pull >= TRIGGER) toggleLamp();
    spring();
  });

  /* touch */
  hit.addEventListener('touchstart', e => { drag = true; startY = e.touches[0].clientY; e.preventDefault(); }, { passive: false });
  window.addEventListener('touchmove', e => { if (drag) { setPull(e.touches[0].clientY - startY); e.preventDefault(); } }, { passive: false });
  window.addEventListener('touchend', () => {
    if (!drag) return; drag = false;
    if (pull >= TRIGGER) toggleLamp();
    spring();
  });
</script>
</body>
</html>
